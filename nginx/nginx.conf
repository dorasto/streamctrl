# Global Nginx settings
worker_processes auto;

events {
    worker_connections 1024;
    # multi_accept on; # Uncomment if you want Nginx to accept as many connections as possible
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Basic performance settings
    sendfile        on;
    tcp_nopush      on; # Don't send partial frames
    tcp_nodelay     on; # Don't buffer data in TCP packets
    keepalive_timeout  65; # Keep-alive timeout for client connections
    types_hash_max_size 2048; # Optimize mime type processing

    # Logging settings
    # Defines a custom log format to capture more details for debugging
    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          '"$http_x_forwarded_for" "$upstream_addr" '
                          '$request_time $upstream_response_time $pipe';

    access_log /var/log/nginx/access.log custom_log;
    error_log /var/log/nginx/error.log warn; # Log errors and warnings to a file

    # --- Proxy settings (can be global or per-location) ---
    # These timeouts are important for general HTTP proxying.
    # Adjust based on expected response times of your frontend/backend.
    proxy_connect_timeout       60s; # Timeout for connecting to the upstream server
    proxy_send_timeout          60s; # Timeout for sending a request to the upstream server
    proxy_read_timeout          60s; # Timeout for reading a response from the upstream server

    # Buffer settings - adjust if you deal with very large responses
    # proxy_buffer_size   128k;
    # proxy_buffers   4 256k;
    # proxy_busy_buffers_size   256k;

    # Client body size limit - important for uploads
    client_max_body_size 10M; # e.g., 10 megabytes. Adjust as needed for file uploads.

    # --- Upstream Definitions ---
    upstream frontend_app {
        # 'frontend' is the service name from docker-compose.yml
        # '3000' is the port exposed by your frontend container
        server frontend:3000;
        # You can add more servers here for load balancing if you scale up your frontend
        # For simple setup, one server entry is fine.
    }

    upstream backend_app {
        # 'backend' is the service name from docker-compose.yml
        # '5468' is the port exposed by your backend container
        server backend:5468;
        # For simple setup, one server entry is fine.
    }

    # --- Server Block for HTTP Requests ---
    server {
        listen 80;
        server_name _; # Listen for any hostname (or specify your domain like your-prod-domain.com)

        # Gzip compression
        gzip on;
        gzip_min_length 1000; # Only compress files larger than 1000 bytes
        gzip_proxied any; # Compress for all proxy requests
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_comp_level 5; # Compression level (1-9, 9 being highest but more CPU intensive)
        gzip_vary on; # Add "Vary: Accept-Encoding" header

        # --- Security Headers (Optional but recommended) ---
        # Add these to improve client-side security
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        # Content-Security-Policy (CSP) is more complex and usually set by the application
        # add_header Content-Security-Policy "default-src 'self';" always;

        # --- Location Blocks (Proxy Rules) ---

        # 1. HTTP API Proxy for /api/backend/
        location /api/backend/ {
            # Rewrite the path for the backend
            # Client requests /api/backend/health -> Backend receives /api/health
            rewrite ^/api/backend/(.*)$ /api/$1 break;

            # Proxy to the backend service's upstream
            proxy_pass http://backend_app;

            # Pass essential headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If your backend requires client certificate forwarding:
            # proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
            # proxy_set_header X-Client-Verify $ssl_client_verify;
        }

        # 2. WebSocket Proxy for /ws
        location /ws {
            # Proxy to the backend service's upstream for WebSockets
            proxy_pass http://backend_app;

            # Crucial WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade"; # Needs to be "upgrade" for WebSockets

            # Other useful headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-lived WS connections (can be very long)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            # Disable proxy buffering for WebSockets for real-time communication
            proxy_buffering off;
        }

        # 3. React Router App (Fallback for Client-Side Routing)
        # All other requests not matched by the above 'location' blocks
        # are routed to your frontend service. This handles both initial HTML
        # and subsequent asset requests.
        location / {
            try_files $uri $uri/ /index.html; # Essential for React Router if it's handling direct file requests or needs a fallback
                                            # However, since you're proxying to `frontend:3000`,
                                            # your frontend server (e.g., react-router-serve) should handle this internally.
                                            # For a simple proxy pass, you might not strictly need try_files here
                                            # if the frontend server always serves index.html for unknown paths.

            proxy_pass http://frontend_app; # Proxy to your frontend service

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}