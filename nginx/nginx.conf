worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on; # Corrected from noppush
    tcp_nodelay     on;
    keepalive_timeout  65;

    # --- Proxy Timeouts ---
    # Keep these reasonable. Longer if your frontend is genuinely slow.
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # --- NO GLOBAL PROXY BUFFERING or GZIP FOR FRONTEND TRAFFIC ---
    # We will specifically disable these where we want "dumb pipe" behavior.
    # client_max_body_size is still useful for uploads, not directly for asset downloads.
    client_max_body_size 10M;


    # Logging settings (keep for debugging!)
    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          '"$http_x_forwarded_for" "$upstream_addr" '
                          '$request_time $upstream_response_time $pipe';
    access_log /var/log/nginx/access.log custom_log;
    error_log /var/log/nginx/error.log warn;


    # --- Upstream Definitions ---
    upstream frontend_app {
        server frontend:3000;
        keepalive 16;
    }

    upstream backend_app {
        server backend:5468;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # --- GZIP GLOBAL CONTROL ---
        # If your frontend server is already gzipping content (which it likely is
        # if using a standard React build/serve setup), then Nginx's gzip
        # can cause issues by trying to re-gzip already gzipped content.
        # Let's disable it entirely or at least for proxied content.
        gzip off; # <--- IMPORTANT: Disable Nginx Gzip entirely
        # If you want to keep gzip for static files served directly by Nginx (not proxied),
        # then you'd need to re-enable it selectively or configure `gzip_proxied off;`

        # Optional security headers (these are fine, they don't modify content directly)
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";


        # --- PROXY RULE 1: HTTP API Proxy for /api/backend/ ---
        location /api/backend/ {
            rewrite ^/api/backend/(.*)$ /api/$1 break;
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # These can stay buffered for backend APIs, less critical for "dumb pipe"
            proxy_buffering on; # Default behavior, good for APIs
        }

        # --- PROXY RULE 2: WebSocket Proxy for /ws ---
        location /ws {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off; # Essential for WebSockets
        }

        # --- TRANSPARENT PROXY FOR /assets/ ---
        location /assets/ {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- KEY SETTINGS FOR "DUMB PIPE" ---
            # Disable Nginx's proxy buffering: Nginx streams content as it receives it.
            proxy_buffering off;
            # Ensure Nginx doesn't modify Transfer-Encoding or Content-Encoding headers from upstream
            proxy_set_header Accept-Encoding ""; # Prevents Nginx from asking for gzipped content from upstream, avoids double-compression issues if upstream always gzips
            proxy_hide_header Content-Encoding; # Hides upstream's Content-Encoding from client (if any issue with it)
            proxy_hide_header Transfer-Encoding; # Hides upstream's Transfer-Encoding from client (if any issue with it)
            # This allows the upstream's headers to flow through mostly untouched.
            # However, if your frontend *is* sending `Transfer-Encoding: chunked`, Nginx will pass that.
            # The `ERR_INCOMPLETE_CHUNKED_ENCODING` means the chunks were incomplete or malformed.
            # This config tries to get out of the way.
        }

        # --- TRANSPARENT PROXY FOR REACT APP (Main / requests) ---
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- KEY SETTINGS FOR "DUMB PIPE" ---
            # Disable Nginx's proxy buffering:
            proxy_buffering off;
            # Ensure Nginx doesn't modify Accept-Encoding, Transfer-Encoding, etc.
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Content-Encoding;
            proxy_hide_header Transfer-Encoding;
        }
    }
}