worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_noppush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # --- Global Proxy Timeouts ---
    # These will be the default for everything unless overridden in a location block.
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # --- Global Proxy Buffering Settings (defaults for all proxy_pass unless overridden) ---
    proxy_buffering on; # Explicitly ON
    proxy_buffer_size   128k;  # Initial buffer for first part of response
    proxy_buffers   4 256k;  # 4 buffers of 256KB each = 1MB total buffer space
    proxy_busy_buffers_size   256k; # Max buffers that can be sent to client concurrently

    client_max_body_size 10M; # Max request body size


    # Logging settings
    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          '"$http_x_forwarded_for" "$upstream_addr" '
                          '$request_time $upstream_response_time $pipe';
    access_log /var/log/nginx/access.log custom_log;
    error_log /var/log/nginx/error.log warn;


    # --- Upstream Definitions ---
    upstream frontend_app {
        server frontend:3000;
        keepalive 16;
    }

    upstream backend_app {
        server backend:5468;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Gzip compression for all content
        gzip on;
        gzip_min_length 1000;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
        gzip_comp_level 5;
        gzip_vary on;
        add_header Vary "Accept-Encoding";

        # Optional security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";


        # --- PROXY RULE 1: HTTP API Proxy for /api/backend/ ---
        location /api/backend/ {
            rewrite ^/api/backend/(.*)$ /api/$1 break;
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- PROXY RULE 2: WebSocket Proxy for /ws ---
        location /ws {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off; # Crucial for WebSockets, overrides global proxy_buffering
        }

        # --- NEW DEDICATED LOCATION FOR ASSETS ---
        # This block will take precedence for any request starting with /assets/
        location /assets/ {
            # No rewrite needed here if the frontend server already expects /assets/ path
            # (which it seems to, from your previous error for /assets/root-J-1c51So.js)

            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure proxy_buffering is ON for assets.
            # This is inherited from the http block, but explicitly setting here
            # makes it clear that we want buffering for assets.
            proxy_buffering on;

            # You could even put higher proxy_read_timeout specifically for assets
            # if you have very large bundles that take a long time to build/send.
            # proxy_read_timeout 120s;

            # Optional: Add specific caching headers for assets (usually handled by frontend build)
            # expires 30d; # Cache assets for 30 days
            # add_header Cache-Control "public, no-transform";
        }

        # --- REACT ROUTER APP (Fallback for Client-Side Routing) ---
        # This handles the root HTML, and any other paths not matching previous locations.
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering for main app content is also ON by default from http block.
            # No need to explicitly set proxy_buffering here unless you want it different
            # from the global setting.
        }
    }
}