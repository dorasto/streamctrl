worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65; # Standard, generally sufficient

    # --- Global Proxy Timeouts ---
    # Give plenty of time for Nginx to connect to and read from upstreams.
    # Increase these significantly to rule out timeouts from Nginx itself.
    proxy_connect_timeout 300s; # 5 minutes to connect
    proxy_send_timeout    300s; # 5 minutes to send request to upstream
    proxy_read_timeout    300s; # 5 minutes to read response from upstream

    # --- Proxy Buffering Control ---
    # This is often the key for ERR_INCOMPLETE_CHUNKED_ENCODING.
    # We will try disabling it for the frontend assets to see if it helps.
    # By default, Nginx buffers the entire response from the upstream before sending to client.
    # Disabling it makes Nginx stream the response as it receives it.
    # proxy_buffering on; # This is the default. We'll try turning it OFF selectively.

    # Logging settings for better debug
    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          '"$http_x_forwarded_for" "$upstream_addr" '
                          '$request_time $upstream_response_time $pipe';
    access_log /var/log/nginx/access.log custom_log;
    error_log /var/log/nginx/error.log warn;


    # --- Upstream Definitions ---
    upstream frontend_app {
        server frontend:3000;
        keepalive 16;
    }

    upstream backend_app {
        server backend:5468;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Gzip compression
        gzip off;
        # gzip_min_length 1000;
        # gzip_proxied any;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
        # gzip_comp_level 5;
        # gzip_vary on;

        # Add `Vary: Accept-Encoding` header for proper caching with gzip
        add_header Vary "Accept-Encoding";

        # Optional security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";


        # --- PROXY RULE 1: HTTP API Proxy for /api/backend ---
        location /api/backend/ {
            rewrite ^/api/backend/(.*)$ /api/$1 break;
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- PROXY RULE 2: WebSocket Proxy for /ws ---
        location /ws {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # --- REACT ROUTER APP (Fallback for Client-Side Routing & Assets) ---
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	        proxy_hide_header Content-Encoding;
	        proxy_hide_header Transfer-Encoding;
            # --- CRITICAL FOR THIS ERROR ---
            # Disable proxy buffering for the frontend.
            # This makes Nginx send the response to the client as it receives it from the frontend,
            # without waiting for the entire response to be buffered first.
            # This can help with incomplete chunked encoding errors if Nginx's buffering is the issue.
            proxy_buffering off;

            # If turning proxy_buffering off works, you might then want to enable it selectively
            # only for static assets where it might improve performance, and turn it off for
            # dynamic content or where issues persist. But let's start with global `off` here.

            # Optional: Disable gzip for this location temporarily to test if it's the culprit
            # gzip off;
        }
    }
}