services:
  nginx:
    # Build the Nginx image using the custom Dockerfile
    build:
      context: .
      dockerfile: ./Dockerfile.nginx
    container_name: streamctrl_nginx
    ports:
      - "4575:80" # Map host port 4575 to container port 80 (Nginx listening)
    depends_on:
      - frontend # Ensure frontend is up before Nginx tries to proxy to it
      - backend # Ensure backend is up before Nginx tries to proxy to it

  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
      # --- IMPORTANT: Pass build-time environment variables here ---
      args:
        # These ARG variables must be declared in Dockerfile.frontend's build stage
        VITE_WS_URL: ${VITE_WS_URL} # Make sure this resolves to a full URL accessible by the browser (via Nginx)
        VITE_API_URL: ${VITE_API_URL} # Make sure this resolves to a full URL accessible by the browser (via Nginx)
        # Add any other VITE_ or build-time prefixed variables here
        # Example: PUBLIC_FEATURE_FLAG: "true"
    container_name: streamctrl_frontend
    # Keeping this for debugging direct access from host, remove if not needed in production
    ports:
      - "4576:3000"
    expose:
      - "3000" # Expose port 3000 to other containers within the Docker network (e.g., Nginx)
    environment:
      # --- These are RUNTIME environment variables for the Bun process ---
      # Only include variables here if your `bun run start` command (the server)
      # needs them at runtime.
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
    depends_on:
      - backend # Frontend might depend on backend if it makes direct calls or for health checks

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    container_name: streamctrl_backend
    expose:
      - "5468" # Expose port 5468 to other containers (like Nginx)
    environment:
      # --- These are RUNTIME environment variables for the Backend process ---
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      # Other backend-specific runtime variables
    # Add database or other dependencies here
